---
- name: Instalar el cliente NFS
  ansible.builtin.apt:
    name: nfs-common
    state: present

# Las copias se guardan en nas, no en la misma máquina que los datos
- name: Montar el directorio de copias desde nas
  ansible.posix.mount:
    src: "{{ ip_nas_datos }}:{{ nas_backup_dir }}"
    path: "{{ bd_backup_dir }}"
    fstype: nfs
    opts: defaults,_netdev
    state: mounted

- name: Script de copia de seguridad
  ansible.builtin.template:
    src: copia-guestbook.sh.j2
    dest: /usr/local/sbin/copia-guestbook.sh
    mode: "0750"

- name: Servicio y timer de la copia diaria
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - copia-guestbook.service
    - copia-guestbook.timer
  notify: Recargar systemd

# systemd tiene que leer las unidades nuevas antes de activar el timer
- name: Aplicar cambios pendientes
  ansible.builtin.meta: flush_handlers

- name: Activar el timer de la copia diaria
  ansible.builtin.systemd_service:
    name: copia-guestbook.timer
    enabled: true
    state: started


- name: Script de restauración
  ansible.builtin.template:
    src: restaura-guestbook.sh.j2
    dest: /usr/local/sbin/restaura-guestbook.sh
    mode: "0750"
