---
- name: Instalar Apache, PHP, git y el cliente de MariaDB
  ansible.builtin.apt:
    name:
      - apache2
      - php
      - libapache2-mod-php
      - php-mysql
      - git
      - mariadb-client
      - php-mbstring
    state: present

- name: Descargar la aplicación
  ansible.builtin.git:
    repo: "{{ app_repo_url }}"
    dest: "{{ web_app_dir }}"
    update: false

# Datos de conexión a la base de datos, generados con plantilla
- name: Generar config.php
  ansible.builtin.template:
    src: config.php.j2
    dest: "{{ web_app_dir }}/config.php"
    owner: root
    group: www-data
    mode: "0640"

- name: Crear el virtual host
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: /etc/apache2/sites-available/guestbook.conf
    mode: "0644"
  notify: Recargar Apache

- name: Activar el módulo rewrite
  ansible.builtin.command: a2enmod rewrite
  args:
    creates: /etc/apache2/mods-enabled/rewrite.load
  notify: Reiniciar Apache

- name: Habilitar el virtual host
  ansible.builtin.command: a2ensite guestbook.conf
  args:
    creates: /etc/apache2/sites-enabled/guestbook.conf
  notify: Recargar Apache

- name: Deshabilitar el sitio por defecto
  ansible.builtin.command: a2dissite 000-default.conf
  args:
    removes: /etc/apache2/sites-enabled/000-default.conf
  notify: Recargar Apache

- name: Asegurar que Apache está arrancado y habilitado
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
