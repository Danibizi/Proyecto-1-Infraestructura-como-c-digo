---
- name: Configuración común
  hosts: all
  become: true
  roles:
    - commons

# bd va antes que web: la aplicación necesita la base de datos lista,al igual que con el servidor nfs
- name: Servidor de base de datos
  hosts: servidores_bd
  become: true
  roles:
    - bd

- name: Servidor NAS (NFS)
  hosts: servidores_nas
  become: true
  roles:
    - nas

- name: Servidor web
  hosts: servidores_web
  become: true
  roles:
    - web
